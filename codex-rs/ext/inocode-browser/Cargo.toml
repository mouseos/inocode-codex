# InoCode browser tab host (CEF). Deliberately NOT a member of the codex-rs workspace:
# the cef crate builds/links CEF, and the rest of the workspace must not depend on it.
# Build it on its own:  cargo build --release --manifest-path ext/inocode-browser/Cargo.toml
[package]
name = "inocode-browser"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "inocode-browser"
path = "src/main.rs"

[dependencies]
bzip2 = "0.6"
cef = { version = "=156.4.0", default-features = false, features = ["build-util"] }
serde_json = "1"
sha1 = "0.10"
tar = "0.4"
ureq = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace]

[profile.release]
opt-level = 1
debug = false
